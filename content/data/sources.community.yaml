- _id: source.asktom-dbms-job-not-working-19c
  title: "Ask TOM: dbms_job.submit(v_job, 'Proc(JOB);', sysdate) - not working anymore in 19c"
  publisher: community
  url: https://asktom.oracle.com/ords/f?p=100:11::::RP:P11_QUESTION_ID:9543716900346819825
  docVersion: "Ask TOM question thread (title as indexed by search engines; page body blocked to automated retrieval on 2026-09-26)"
  retrievedAt: 2026-09-26
  note: "Community question asserting that DBMS_JOB submission stopped working after an upgrade from 12.1.0.2 to 19.8; cited as an example of the 'DBMS_JOB no longer works in 19c' claim."

- _id: source.oracle-base-dbms-job-19c
  title: "ORACLE-BASE: DBMS_JOB jobs converted to DBMS_SCHEDULER jobs in Oracle Database 19c"
  publisher: community
  url: https://oracle-base.com/articles/19c/dbms_job-jobs-converted-to-dbms_scheduler-jobs-19c
  docVersion: "article created 2019-08-27, updated 2020-11-14"
  retrievedAt: 2026-09-26
  note: "DBMS_JOB submissions create DBMS_JOB$_n scheduler jobs, the legacy interface keeps working, CREATE JOB privilege is now required, job submission stays transactional."

- _id: source.mikedietrich-dbms-job-19c
  title: "Mike Dietrich: DBMS_JOB behavior change in Oracle 19c during upgrade"
  publisher: community
  url: https://mikedietrichde.com/2019/05/24/dbms_job-behavior-change-in-oracle-19c-during-upgrade/
  docVersion: "blog post 2019-05-24"
  retrievedAt: 2026-09-26
  note: "Upgrade converts DBMS_JOB jobs into scheduler jobs, DBMS_JOB remains a wrapper over DBMS_SCHEDULER, CREATE JOB must be granted, deprecated since 12.2.0.1 with no desupport announced."

- _id: source.connor-mcdonald-dbms-job-transactions
  title: "Connor McDonald: DBMS_JOB - the joy of transactions"
  publisher: community
  url: https://connor-mcdonald.com/2019/05/28/dbms_job-the-joy-of-transactions/
  docVersion: "blog post 2019-05-28"
  retrievedAt: 2026-09-26
  note: "In 19c DBMS_JOB.SUBMIT creates a paired scheduler job yet stays transactional (rolled back with the caller), unlike DBMS_SCHEDULER which commits immediately."

