  docVersion: "Ora2Pg 25.0 ($VERSION = '25.0')"
  retrievedAt: 2026-09-26
  note: "Base type hash maps NUMBER to numeric, DATE to timestamp(0), ROWID/UROWID to oid, XMLTYPE to xml, BOOLEAN to boolean, SDO_GEOMETRY to geometry; _sql_type returns default_numeric (bigint) for NUMBER without precision when pg_integer_type is on, and Ora2Pg.pm sets pg_integer_type = 1 and default_numeric = bigint when unset."

