- _id: source.ua-blog-ha-decision-tree
  title: 'The Oracle HA Decision Tree: RAC vs Data Guard vs Both'
  publisher: firsthand
  url: https://uptimearchitect.com/blog/oracle-ha-decision-tree-rac-vs-data-guard/
  docVersion: blog post, 2026-05
  retrievedAt: 2026-09-26
