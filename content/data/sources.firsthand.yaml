- _id: source.ua-blog-charset-migration-data-loss
  title: The Migration Completed Successfully. Half the Names Are Now Question Marks.
  publisher: firsthand
  url: https://uptimearchitect.com/blog/oracle-character-set-migration-data-loss/
  docVersion: blog post, 2026-09
  retrievedAt: 2026-09-26
