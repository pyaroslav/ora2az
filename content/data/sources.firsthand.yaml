- _id: source.ua-lab-migration-methods
  title: 'oracle-labs: migration-methods (method-selection scenarios with answer key)'
  publisher: firsthand
  url: https://github.com/pyaroslav/oracle-labs/tree/main/migration-methods
  docVersion: lab, 2026-07
  retrievedAt: 2026-09-26
  note: 'Six graded scenarios: same-arch lift to Exadata (Data Guard), big-endian exit (XTTS with RMAN CONVERT), into Autonomous
